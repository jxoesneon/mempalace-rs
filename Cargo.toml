[package]
name = "mempalace-rs"
version = "0.5.0"
edition = "2021"
description = "High-performance, local AI memory with AAAK v3.2 protocol and temporal Knowledge Graph"
license = "MIT"
repository = "https://github.com/jxoesneon/mempalace-rs"
homepage = "https://github.com/jxoesneon/mempalace-rs"
keywords = ["memory", "ai", "mcp", "knowledge-graph", "aaak"]
categories = ["command-line-utilities", "database", "artificial-intelligence"]
readme = "README.md"
documentation = "https://docs.rs/mempalace-rs"
default-run = "mempalace-rs"
exclude = [
    "models/*",
    ".fastembed_cache/*",
    "assets/*",
    "benchmarks/*",
    "*.db",
    "*.db-journal",
    "target/*"
]

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.102"
async-trait = "0.1"
rand = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# chromadb = "2.3.0"  # Replaced by pure-Rust usearch + fastembed
tokio = { version = "1.53.0", features = ["full"] }
mcp_rs = { version = "0.1.0" }
futures = "0.3.32"
walkdir = "2.5.0"
regex = "1.12.3"
chrono = "0.4.44"
symspell = "0.3.0"
reqwest = { version = "0.13.4", features = ["json"] }
rayon = "1.10"
dialoguer = "0.11"
tempfile = "3.27.0"
lazy_static = "1.5.0"
sha2 = "0.11.0"
hex = "0.4.3"

# Pure-Rust storage engine dependencies (replaces ChromaDB)
fastembed = "5.17.3"
usearch = "2"
ignore = "0.4.25"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zip = "2"
quick-xml = "0.36"
csv = "1.3"
encoding_rs = "0.8"
serde_yaml = "0.9"
toml = "1.1.3"

[[bin]]
name = "update-benchmarks"
path = "scripts/update_benchmarks.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.9"
tempfile = "3.27.0"

[[bench]]
name = "benchmarks"
harness = false

[[bin]]
name = "download-model"
path = "src/bin/download_model.rs"

# Patch core2 to fix yanked version (RUSTSEC-2026-0099)
# All crates.io versions were yanked, using GitHub source
# Version bumped to 0.4.1 to avoid yank conflict
[patch.crates-io]
core2 = { path = "patches/core2" }
