[package]
name = "mempalace-rs"
version = "0.5.1"
edition = "2021"
description = "High-performance, local AI memory with AAAK v3.2 protocol and temporal Knowledge Graph"
license = "MIT"
repository = "https://github.com/jxoesneon/mempalace-rs"
homepage = "https://github.com/jxoesneon/mempalace-rs"
keywords = ["memory", "ai", "mcp", "knowledge-graph", "aaak"]
categories = ["command-line-utilities", "database", "artificial-intelligence"]
readme = "README.md"
documentation = "https://docs.rs/mempalace-rs"
default-run = "mempalace-rs"
exclude = [
    "models/*",
    ".fastembed_cache/*",
    "assets/*",
    "benchmarks/*",
    "*.db",
    "*.db-journal",
    "target/*"
]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
async-trait = "0.1.92"
rand = "0.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# chromadb = "2.3.0"  # Replaced by pure-Rust usearch + fastembed
tokio = { version = "1.53.2", features = ["full"] }
mcp_rs = { version = "0.1.0" }
futures = "0.3.34"
walkdir = "2.5.0"
regex = "1.13.1"
chrono = "0.4.45"
symspell = "0.5.2"
reqwest = { version = "0.13.5", features = ["json"] }
rayon = "1.12.0"
dialoguer = "0.12.0"
tempfile = "3.27.0"
lazy_static = "1.5.1"
sha2 = "0.11.0"
hex = "0.4.3"

# Pure-Rust storage engine dependencies (replaces ChromaDB)
fastembed = "7.1.0"
usearch = "2.26.3"
ignore = "0.4.33"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zip = "8.6.0"
quick-xml = "0.42.0"
csv = "1.4.0"
encoding_rs = "0.8.42"
serde_yml = "0.0.12"
toml = "1.1.3"

[[bin]]
name = "update-benchmarks"
path = "scripts/update_benchmarks.rs"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand = "0.10"
tempfile = "3.27.0"

[[bench]]
name = "benchmarks"
harness = false

[[bin]]
name = "download-model"
path = "src/bin/download_model.rs"

# NOTE: the former [patch.crates-io] core2 workaround was removed —
# bitstream-io 4.10.0 replaced core2 with no_std_io2, so the yanked
# core2 dependency is no longer in the crate graph.
